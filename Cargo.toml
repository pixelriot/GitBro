[package]
name = "gitbro"
version = "0.1.0"
edition = "2024"
description = "A slim Git client built with and for Omarchy: see the graph, commit and push in one step"
license = "0BSD"
repository = "https://github.com/pixelriot/GitBro"
readme = "README.md"
keywords = ["git", "gui", "rune", "omarchy", "hyprland"]
categories = ["development-tools", "gui"]

[dependencies]
anyhow = "1.0.104"
git2 = "0.21.0"

# Rune, pinned to a `dev` commit; the framework says `dev` is never rewritten.
rune = { git = "https://github.com/anomalyco/rune", rev = "bca47138e9c31a7870a79272ee2523b592b1248d", features = ["native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "bca47138e9c31a7870a79272ee2523b592b1248d" }

# Rune paints and lays out every frame; unoptimized it drops on a large graph.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
